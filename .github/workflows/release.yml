name: Build & Attach macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build Nectar macOS DMG (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sync package.json version with release tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$CURRENT_VERSION" ]; then
            npm version "$TAG_VERSION" --no-git-tag-version
          fi

      - name: Install dependencies
        run: npm install

      - name: Build macOS arm64 DMG
        run: npm run dist:dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Check the app users download: a broken signature makes macOS report it
      # as "damaged" with no way to allow it.
      - name: Verify the DMG's app is ad-hoc signed
        run: scripts/verify-dmg.sh release/*.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nectar-macOS-arm64-dmg
          path: release/*.dmg

      - name: Attach DMG to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/*.dmg --clobber
